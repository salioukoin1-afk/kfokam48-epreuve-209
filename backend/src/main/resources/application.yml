spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/kfokam48}
    username: ${DB_USER:kfokam48}
    password: ${DB_PASSWORD:kfokam48}
  jpa:
    hibernate:
      ddl-auto: validate        # B5 : le schéma appartient à Flyway, jamais à Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

# Swagger UI : la documentation interactive de l'API (contrat v1.2)
springdoc:
  swagger-ui:
    path: /swagger-ui.html

# US-09 : durée de vie du code de présence (RG1) — configurable, jamais en dur
presence:
  expiration-minutes: ${PRESENCE_EXPIRATION_MINUTES:15}
