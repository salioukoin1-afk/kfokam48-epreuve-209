spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # La base H2 de test vit le temps de la JVM : si les checksums de migrations changent
    # (correction de V1 après l'échec PostgreSQL), on repart d'une base propre.
    clean-on-validation-error: true

# Valeur volontairement différente du défaut : prouve que RG1 lit la configuration (US-09)
presence:
  expiration-minutes: 5
